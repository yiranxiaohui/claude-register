services:
  claude-register:
    image: ghcr.io/yiranxiaohui/claude-register:latest
    restart: unless-stopped
    ports: ["8790:8790"]
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml

  # Optional V2Ray-compatible egress. Enable with --profile v2ray.
  # The application uses socks5h://xray:10808 when this profile is enabled.
  xray:
    profiles: ["v2ray"]
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    expose:
      - "10808"
    healthcheck:
      test: ["CMD", "xray", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
