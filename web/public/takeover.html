<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Register 接管</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      body { overflow: hidden; background: #111827; color: #f9fafb; font-family: sans-serif; }
      #notice {
        position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
        background: rgba(17, 24, 39, .92); text-align: center;
      }
      #notice.visible { display: grid; }
      #clipboard-tip {
        position: fixed; right: 12px; bottom: 12px; z-index: 5; max-width: 360px;
        padding: 8px 12px; border-radius: 6px; background: rgba(17, 24, 39, .88);
        box-shadow: 0 2px 8px rgba(0, 0, 0, .3); font-size: 13px; line-height: 1.5;
        transition: opacity .2s;
      }
      #clipboard-tip.hidden { opacity: 0; pointer-events: none; }
      button {
        margin-top: 16px; padding: 8px 16px; border: 1px solid #6b7280; border-radius: 6px;
        background: #1f2937; color: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <iframe
      id="viewer"
      src="/vnc/?reconnect=yes&amp;clipboard=yes&amp;keyboard=no&amp;sharing=yes&amp;steal=yes&amp;sound=no&amp;printing=no&amp;file_transfer=no&amp;floating_menu=yes&amp;toolbar_position=top-right&amp;autohide=yes"
      title="Xpra HTML5 接管画面"
      allow="clipboard-read; clipboard-write"
      allowfullscreen
    ></iframe>
    <div id="clipboard-tip"></div>
    <div id="notice">
      <div>
        <div id="message">接管会话已断开</div>
        <button id="reload" type="button">重新加载</button>
      </div>
    </div>
    <script>
      const notice = document.getElementById("notice");
      const message = document.getElementById("message");
      const viewer = document.getElementById("viewer");
      const clipboardTip = document.getElementById("clipboard-tip");
      let heartbeatTimer;
      let viewerHealthTimer;
      let disconnectedAt = 0;

      if (!window.isSecureContext || !navigator.clipboard) {
        clipboardTip.textContent = "当前不是 HTTPS 安全页面，浏览器会限制自动剪贴板；仍可用 Xpra 右上角菜单手动复制粘贴。";
      } else {
        clipboardTip.textContent = "已启用双向剪贴板；首次复制粘贴时请允许浏览器访问剪贴板。";
        setTimeout(() => clipboardTip.classList.add("hidden"), 8_000);
      }

      async function heartbeat() {
        try {
          const response = await fetch("/api/takeover/heartbeat", {
            method: "POST",
            credentials: "same-origin",
          });
          if (response.ok) return;
          if (response.status === 401 || response.status === 409) {
            message.textContent = response.status === 401
              ? "面板登录已失效，请重新登录"
              : "接管会话已结束";
            notice.classList.add("visible");
            clearInterval(heartbeatTimer);
          }
        } catch {
          // 短暂网络中断不立即终止会话；下一轮心跳会自动重试。
        }
      }

      document.getElementById("reload").addEventListener("click", () => {
        window.location.reload();
      });

      function recoverViewer() {
        if (!navigator.onLine) return;
        try {
          const xpra = viewer.contentWindow && viewer.contentWindow.client;
          // Xpra 会先自行快速重连；持续失败 15 秒后重载 iframe，重新获得一轮
          // 完整重连机会。这样短暂丢包不会闪屏，长断线恢复后也无需人工刷新。
          if (!xpra || xpra.connected || xpra.reconnect_in_progress) {
            disconnectedAt = 0;
            return;
          }
          if (!disconnectedAt) disconnectedAt = Date.now();
          if (Date.now() - disconnectedAt >= 15_000) {
            viewer.src = viewer.src;
            disconnectedAt = 0;
          }
        } catch {
          // iframe 尚未完成同源页面加载时下一轮再检查。
        }
      }

      window.addEventListener("online", () => {
        heartbeat();
        recoverViewer();
      });

      // —— 画面尺寸跟随 ——
      // Xpra 5.1 + Xvfb 下只有「客户端建连」这条路会为画布尺寸新增精确的 RandR
      // 分辨率。客户端自带的 window.resize 处理会同时发 desktop_size 和桌面窗口的
      // configure-window，后者在 Xvfb 上只能选已有的最近分辨率（实测会跳回
      // 8192x4096 或停在旧尺寸），两者还会互相打架。所以改为：卸掉客户端自己
      // 的 resize 监听，窗口尺寸稳定后由本页重连一次，让桌面精确匹配新尺寸；
      // 服务端的窗口自适应（server/window_fit.py）再把浏览器窗口铺满桌面。
      const RESIZE_SETTLE_MS = 700;
      const RESIZE_TOLERANCE = 4;
      let connectedSize = null;
      let resizeTimer;
      let unbindTimer;

      function viewerSize() {
        return [viewer.clientWidth, viewer.clientHeight];
      }

      function detachClientResize() {
        // Xpra 客户端在构造时用 jQuery(window).resize(...) 绑定；页面加载完成的
        // 时机不确定，轮询到 client 出现再卸载。失败（如 Xpra 换了实现）时
        // 仍会重连，只是可能多一次闪烁。
        clearInterval(unbindTimer);
        let tries = 0;
        unbindTimer = setInterval(() => {
          tries += 1;
          try {
            const w = viewer.contentWindow;
            if (w && w.client && w.jQuery) {
              w.jQuery(w).off("resize");
              clearInterval(unbindTimer);
              return;
            }
          } catch {
            // iframe 尚未就绪，继续等。
          }
          if (tries >= 40) clearInterval(unbindTimer);
        }, 250);
      }

      viewer.addEventListener("load", onViewerLoad);
      function onViewerLoad() {
        connectedSize = viewerSize();
        detachClientResize();
      }
      try {
        if (viewer.contentDocument && viewer.contentDocument.readyState === "complete"
            && viewer.contentWindow.location.pathname.startsWith("/vnc/")) {
          onViewerLoad();
        }
      } catch {
        // 还在加载，等 load 事件。
      }

      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!connectedSize) return;
          const [w, h] = viewerSize();
          if (
            Math.abs(w - connectedSize[0]) <= RESIZE_TOLERANCE &&
            Math.abs(h - connectedSize[1]) <= RESIZE_TOLERANCE
          ) {
            return;
          }
          connectedSize = [w, h];
          disconnectedAt = 0;
          viewer.src = viewer.src; // 重连：按新画布尺寸精确调整远程桌面
        }, RESIZE_SETTLE_MS);
      });
      heartbeatTimer = setInterval(heartbeat, 20_000);
      viewerHealthTimer = setInterval(recoverViewer, 5_000);
      heartbeat();
    </script>
  </body>
</html>
