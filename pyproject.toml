[project]
name = "claude-register"
version = "0.1.0"
description = "Open Claude login with AnyMail auto-fill"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.61.0",
]

[project.scripts]
claude-register = "claude_register.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_register"]
