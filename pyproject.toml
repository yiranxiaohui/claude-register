[project]
name = "claude-register"
version = "0.1.0"
description = "Open Claude login with AnyMail auto-fill"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "playwright>=1.61.0",
    "camoufox[geoip]>=0.4.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
]

[project.scripts]
claude-register = "claude_register.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_register"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
