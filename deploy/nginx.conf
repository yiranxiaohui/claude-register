user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream panel {
        server 127.0.0.1:8791;
        keepalive 16;
    }

    upstream kasmvnc {
        server 127.0.0.1:6901;
    }

    server {
        listen 8790;
        server_name _;
        client_max_body_size 10m;

        # auth_request 只在 Nginx 内部调用；FastAPI 校验面板签名 Cookie。
        location = /_vnc_auth {
            internal;
            proxy_pass http://panel/api/vnc-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /vnc {
            return 308 /vnc/;
        }

        # KasmVNC 的静态资源和 RFB-over-WebSocket 直接通往 Xvnc。
        # 不再经过 Python 解包/重封装 WebSocket 帧。
        location /vnc/ {
            auth_request /_vnc_auth;
            proxy_pass http://kasmvnc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin http://127.0.0.1:6901;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # KasmVNC 客户端会连同源根路径 /websockify，需要单独转发。
        location = /websockify {
            auth_request /_vnc_auth;
            proxy_pass http://kasmvnc/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin http://127.0.0.1:6901;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
