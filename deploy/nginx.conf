user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream panel {
        server 127.0.0.1:8791;
        keepalive 16;
    }

    upstream xpra {
        server 127.0.0.1:14500;
    }

    server {
        listen 8790;
        server_name _;
        client_max_body_size 10m;

        # auth_request 只在 Nginx 内部调用；FastAPI 校验面板签名 Cookie。
        location = /_vnc_auth {
            internal;
            proxy_pass http://panel/api/vnc-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /vnc {
            return 308 /vnc/;
        }

        # Xpra 的 HTML5 静态资源和原生 WebSocket 直接通往 Xpra。
        # Xpra 客户端会在当前 /vnc/ 路径原地升级 WebSocket，因此静态与 WS
        # 共用这个 location；客户端自带 ping 和自动重连。
        location /vnc/ {
            auth_request /_vnc_auth;
            proxy_pass http://xpra/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_socket_keepalive on;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
